# Babel configuration file for string extraction
# Run from the repo root (mapping paths are relative to the input dir):
# pybabel extract -F babel.cfg -k _ -k _g -k _l -k gettext -k lazy_gettext -o trendsearth_ui/i18n/translations/messages.pot .

[python: trendsearth_ui/**.py]
encoding = utf-8

[jinja2: trendsearth_ui/**/templates/**.html]
encoding = utf-8
extensions = jinja2.ext.autoescape,jinja2.ext.with_
